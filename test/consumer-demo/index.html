<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-gis-geo consumer test</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.45;
        color: #0f172a;
      }
      body {
        max-width: 36rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.875rem;
      }
      input[type='number'] {
        width: 100%;
        max-width: 16rem;
        margin-top: 0.25rem;
        padding: 0.35rem 0.5rem;
      }
      input[type='file'] {
        margin-top: 0.35rem;
      }
      button {
        margin-top: 1rem;
        margin-right: 0.5rem;
        padding: 0.4rem 0.75rem;
        cursor: pointer;
      }
      pre {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        background: #f1f5f9;
        border-radius: 0.375rem;
        font-size: 0.8125rem;
        overflow: auto;
      }
      .hint {
        font-size: 0.8125rem;
        color: #64748b;
        margin-top: 0.25rem;
      }
      .status {
        font-size: 0.875rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>mini-gis-geo — local install smoke test</h1>
    <p class="hint">
      Dependency: <code>mini-gis-geo</code> from the npm registry (<code>^1.0.1</code> in
      <code>package.json</code>).
    </p>

    <button type="button" id="sample">Load bundled sample</button>
    <label>
      Load export JSON
      <input id="file" type="file" accept="application/json,.json" />
    </label>
    <p id="loadStatus" class="status"></p>
    <p id="dataWhere" class="hint"></p>

    <label>
      x (longitude, °)
      <input id="x" type="number" step="any" value="1" />
    </label>
    <label>
      y (latitude, °)
      <input id="y" type="number" step="any" value="1" />
    </label>
    <p class="hint">Same plane as the library: <code>latLngToXY</code> uses x = lng, y = lat.</p>

    <button type="button" id="run">Run checks</button>
    <pre id="out">Load JSON first, then set x / y and click Run checks.</pre>

    <script type="module" src="/main.js"></script>
  </body>
</html>
